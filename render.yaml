# Render Blueprint for the NestJS API (temporary hosting until production).
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets are entered
# in the dashboard (sync: false), never committed.
services:
  - type: web
    name: ssc-prep-api
    runtime: node
    # Same area as the Neon database (AWS us-east-2, Ohio) so queries stay fast.
    region: ohio
    plan: free
    branch: master
    buildCommand: npm run build:render
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon POOLED connection string (host contains "-pooler").
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT connection string; only needed for migrations.
      - key: DIRECT_URL
        sync: false
      # Comma-separated frontend URLs allowed to call the API.
      - key: CORS_ORIGINS
        sync: false
